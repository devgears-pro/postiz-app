name: Build fork image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: integration/build
      tag:
        description: Image tag
        required: true
        default: uk-latest

permissions:
  contents: read
  packages: write

concurrency:
  group: build-fork-image
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-agent-config.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'integration/build' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devgears-pro/postiz-app:${{ inputs.tag || 'uk-latest' }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ inputs.tag || 'uk-latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: ghcr.io/devgears-pro/postiz-app:${{ inputs.tag || 'uk-latest' }}" >> "$GITHUB_STEP_SUMMARY"
