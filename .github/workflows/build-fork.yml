name: Build fork image

on:
  push:
    branches:
      - integration/build
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: integration/build
      tag:
        description: Image tag override
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-fork-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(tr -d '[:space:]' < postiz-version.txt)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devgears-pro/postiz-app:${{ steps.version.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: ghcr.io/devgears-pro/postiz-app:${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
